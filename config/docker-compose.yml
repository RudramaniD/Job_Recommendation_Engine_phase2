version: '3.8'

services:
   qdrant:
     image: qdrant/qdrant:latest
     ports:
       - "6333:6333"
       - "6334:6334"
     volumes:
       - qdrant_storage:/qdrant/storage
     environment:
       - QDRANT_SERVICE_HTTP_PORT=6333
       - QDRANT_SERVICE_GRPC_PORT=6334
     networks:
       - job-engine

   sync-service:
      build: ..
      container_name: job-sync-service
      command: python scripts/run_sync_service.py
      environment:
        - MONGO_URI=${MONGO_URI}
        - QDRANT_HOST=qdrant
        - QDRANT_PORT=6333
      depends_on:
        - qdrant
      restart: unless-stopped
      volumes:
        - sync_data:/app/.sync_data
      networks:
        - job-engine

volumes:
  qdrant_storage:
    driver: local
  sync_data:
    driver: local

networks:
  job-engine:
    driver: bridge
